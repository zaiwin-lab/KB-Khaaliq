<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin · Sarawak Digital Champion Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="site-head" style="top:0">
  <div class="head-inner">
    <a class="brand" href="index.html">
      <span class="logo">SDC</span>
      <span>Sarawak Digital Champion
        <small>Admin · CRM &amp; Business Intelligence</small></span>
    </a>
    <div class="head-cta">
      <a class="btn btn-ghost btn-sm" href="index.html">← Portal</a>
      <button class="btn btn-dark btn-sm" id="seedBtn">Load sample data</button>
      <button class="btn btn-primary btn-sm" id="exportBtn">Export</button>
    </div>
  </div>
</header>

<main class="admin-wrap">
  <div class="admin-head">
    <h1>Business Intelligence Dashboard</h1>
  </div>

  <div class="kpis" id="kpis"></div>

  <div class="toolbar">
    <input id="search" placeholder="Search business, owner, district…" />
    <select id="statusFilter"></select>
    <select id="sortBy">
      <option value="score">Sort: Lead score</option>
      <option value="date">Sort: Newest</option>
      <option value="name">Sort: Name</option>
    </select>
    <span class="spacer"></span>
    <button class="btn btn-ghost btn-sm" id="exportCsv">Export CSV</button>
  </div>

  <div class="table-card">
    <table class="subs">
      <thead><tr>
        <th>Business</th><th class="hide-sm">District</th><th class="hide-sm">Category</th>
        <th>Score</th><th>Status</th><th class="hide-sm">Submitted</th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="empty" id="empty" style="display:none">
      No submissions yet. <a href="index.html">Register a business</a> or click
      <strong>“Load sample data”</strong> to explore the dashboard.
    </div>
  </div>
</main>

<!-- detail drawer -->
<div class="drawer-back" id="drawerBack"></div>
<aside class="drawer" id="drawer" aria-label="Submission detail">
  <div class="drawer-head">
    <h2 id="dTitle">—</h2>
    <button class="x" id="dClose" aria-label="Close">×</button>
  </div>
  <div class="drawer-body" id="dBody"></div>
</aside>

<script src="data.js"></script>
<script src="engine.js"></script>
<script src="admin.js"></script>
</body>
</html>
