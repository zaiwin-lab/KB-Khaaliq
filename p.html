<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>Opening your website preview…</title>
<style>
  body { margin: 0; height: 100vh; display: grid; place-items: center;
    font-family: "Inter", system-ui, -apple-system, sans-serif;
    background: linear-gradient(155deg, #0b1f3a, #08182f); color: #fff; }
  .box { text-align: center; }
  .spin { width: 38px; height: 38px; margin: 0 auto 1rem; border-radius: 50%;
    border: 3px solid rgba(255,255,255,.18); border-top-color: #f47c20; animation: s 1s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
  a { color: #ff9a45; }
</style>
</head>
<body>
  <div class="box">
    <div class="spin"></div>
    <p>Opening your website preview…</p>
    <p id="fallback" style="display:none">If it doesn't open, <a id="manual" href="#">tap here</a>.</p>
  </div>
<script>
(function () {
  var p = new URLSearchParams(location.search);
  var u = p.get("u");
  var id = (p.get("id") || "").replace(/[^A-Za-z0-9_-]/g, "-");
  var done = false;
  function go() { if (done) return; done = true; if (u) location.replace(u); }
  if (u) { document.getElementById("manual").href = u; document.getElementById("fallback").style.display = "block"; }
  // Count this open (shared hit counter), then forward to the real preview.
  if (id) {
    try {
      fetch("https://abacus.jasoncameron.dev/hit/khaaliqsdc/" + encodeURIComponent(id))
        .catch(function () {}).finally(go);
    } catch (e) { go(); }
    setTimeout(go, 1500); // safety net
  } else { go(); }
})();
</script>
</body>
</html>
